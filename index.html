<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AISA Tech Escape Room</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: #02090b;

  color: #d8f8f2;

  font:
    15px
    Consolas,
    monospace;
}


/* ============================================================
   START SCREEN
============================================================ */

#start {

  position: fixed;

  inset: 0;

  display: grid;

  place-items: center;

  background:
    radial-gradient(
      circle,
      #0a3035,
      #02090b 65%
    );

  z-index: 5;

  padding: 20px;
}


.card,
.panel,
.top {

  background: #061519;

  border:
    1px solid
    #154047;

  border-radius: 14px;
}


.card {

  width:
    min(
      620px,
      100%
    );

  padding: 28px;
}


h1,
h2 {

  color: #00ff9d;
}


h1 {

  margin:
    0 0 8px;
}


label {

  display: block;

  color: #8eb5ae;

  margin:
    12px 0 6px;
}


input {

  width: 100%;

  padding: 13px;

  border-radius: 9px;

  border:
    1px solid
    #28585e;

  background: #02090b;

  color: #fff;

  font:
    15px
    Consolas,
    monospace;

  outline: none;
}


input:focus {

  border-color:
    #00ff9d;

  box-shadow:
    0 0 10px
    rgba(
      0,
      255,
      157,
      0.15
    );
}


button {

  padding:
    13px 18px;

  border-radius: 9px;

  border:
    1px solid
    #00ff9d;

  background:
    #00ff9d;

  color:
    #02100c;

  font:
    bold 15px
    Consolas,
    monospace;

  cursor: pointer;

  margin:
    8px 6px 0 0;

  transition:
    0.2s;
}


button:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 0 15px
    rgba(
      0,
      255,
      157,
      0.25
    );
}


button.alt {

  background:
    transparent;

  color:
    #00ff9d;
}


.hidden {

  display:
    none !important;
}


/* ============================================================
   GAME
============================================================ */

#game {

  max-width:
    1200px;

  margin:
    auto;

  padding:
    15px;
}


.top {

  padding:
    13px 16px;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    10px;

  flex-wrap:
    wrap;

  position:
    sticky;

  top:
    5px;

  z-index:
    4;
}


.green {

  color:
    #00ff9d;
}


.badge {

  display:
    inline-block;

  border:
    1px solid
    #28585e;

  padding:
    7px 10px;

  border-radius:
    8px;

  margin:
    2px;
}


/* ============================================================
   PROGRESS
============================================================ */

.progress {

  height:
    7px;

  background:
    #082126;

  margin-top:
    10px;

  border-radius:
    8px;

  overflow:
    hidden;
}


.progress i {

  display:
    block;

  height:
    100%;

  background:
    #00ff9d;

  width:
    0%;

  transition:
    width 0.4s ease;
}


/* ============================================================
   LAYOUT
============================================================ */

.layout {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    16px;

  margin-top:
    16px;
}


.panel {

  padding:
    17px;
}


/* ============================================================
   ROOM IMAGE
============================================================ */

.room {

  width:
    100%;

  height:
    350px;

  object-fit:
    cover;

  border-radius:
    10px;

  border:
    1px solid
    #28585e;
}


.level {

  color:
    #00ff9d;

  letter-spacing:
    2px;

  font-size:
    14px;
}


.question {

  white-space:
    pre-line;

  font-size:
    19px;

  line-height:
    1.5;

  color:
    #fff;

  margin-top:
    12px;
}


.clue {

  margin:
    15px 0;

  padding:
    12px;

  background:
    #071b1f;

  border-left:
    3px solid
    #00ff9d;

  color:
    #b8d7d1;

  white-space:
    pre-line;
}


#feedback {

  min-height:
    28px;

  margin-top:
    10px;

  font-weight:
    bold;
}


.good {

  color:
    #00ff9d;
}


.bad {

  color:
    #ff6666;
}


.hint {

  color:
    #ffd166;
}


/* ============================================================
   FINISH SCREEN
============================================================ */

.finish {

  text-align:
    center;

  padding:
    45px 20px;
}


.finish .big {

  font-size:
    70px;

  color:
    #00ff9d;

  text-shadow:
    0 0 25px
    rgba(
      0,
      255,
      157,
      0.4
    );

  margin-bottom:
    10px;
}


.finish h2 {

  font-size:
    28px;

  margin:
    12px 0;
}


.finish p {

  font-size:
    16px;

  line-height:
    1.6;
}


.finish .final-time {

  font-size:
    32px;

  color:
    #00ff9d;

  font-weight:
    bold;

  margin:
    20px 0;
}


.save-status {

  margin-top:
    25px;

  padding:
    12px;

  border:
    1px solid
    #00ff9d;

  border-radius:
    8px;

  color:
    #00ff9d;

  background:
    rgba(
      0,
      255,
      157,
      0.04
    );
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:800px) {

  .layout {

    grid-template-columns:
      1fr;
  }

  .room {

    height:
      260px;
  }

  .question {

    font-size:
      17px;
  }

}

</style>

</head>


<body>


<!-- ==========================================================
     HIDDEN SUBMISSION FRAME

     Google Apps Script receives the form POST here.
=========================================================== -->

<iframe
  name="aisa_submit_frame"
  id="aisa_submit_frame"
  style="
    display:none;
    width:0;
    height:0;
    border:0;
  "
></iframe>


<!-- ==========================================================
     START SCREEN
=========================================================== -->

<div id="start">

  <div class="card">

    <h1>
      🔐 AISA TECH ESCAPE
    </h1>

    <p>
      7-level cyber mission • Team of 2
    </p>

    <label>
      Team Name
    </label>

    <input
      id="team"
      maxlength="30"
      placeholder="TEAM ALPHA"
      autocomplete="off"
    >


    <label>
      Member 1
    </label>

    <input
      id="m1"
      maxlength="40"
      placeholder="Participant name"
      autocomplete="off"
    >


    <label>
      Member 2
    </label>

    <input
      id="m2"
      maxlength="40"
      placeholder="Participant name"
      autocomplete="off"
    >


    <button
      onclick="startGame()"
    >
      INITIALIZE MISSION
    </button>

  </div>

</div>


<!-- ==========================================================
     GAME SCREEN
=========================================================== -->

<div
  id="game"
  class="hidden"
>


  <!-- TOP BAR -->

  <div class="top">

    <b class="green">
      🔐 AISA // ESCAPE NODE
    </b>


    <div>

      <span class="badge">

        TEAM:

        <b id="tv">
        </b>

      </span>


      <span class="badge">

        TIME:

        <b id="timer">
          00:00
        </b>

      </span>


      <span class="badge">

        LEVEL:

        <b id="lv">
          1/7
        </b>

      </span>

    </div>

  </div>


  <!-- PROGRESS BAR -->

  <div class="progress">

    <i id="bar">
    </i>

  </div>


  <!-- MAIN LAYOUT -->

  <div class="layout">


    <!-- LEFT PANEL -->

    <div class="panel">

      <img
        src="room.svg"
        class="room"
        alt="Cyber escape room"
      >

      <p>
        Search the clues and solve each level.
        Stay on this page.
      </p>

    </div>


    <!-- RIGHT PANEL -->

    <div
      class="panel"
      id="puzzle"
    >
    </div>


  </div>

</div>


<script>


/* ============================================================
   GOOGLE APPS SCRIPT WEB APP URL
============================================================ */

const API =
  "https://script.google.com/macros/s/AKfycbxyrkIEMWMQOqbti6h3AoLKYX-5hD8ql-WsuWoLoTilPzqsD-MiVfkFmamtsOzQfpia/exec";


/* ============================================================
   7 LEVELS
============================================================ */

const L = [

  [
    "CYBER LOCK",

    `A binary lock displays:

01000110 01001001 01010110 01000101

Convert it to a word.
Count its letters × 7.`,

    "01000110=F, 01001001=I, 01010110=V, 01000101=E.",

    "28"
  ],


  [
    "ENCRYPTED MESSAGE",

    `KHOOR is encrypted with a Caesar shift.

Shift each letter backward by 3.

Then calculate H + O
using A=1...Z=26.`,

    "KHOOR → HELLO. H=8, O=15.",

    "23"
  ],


  [
    "LOGIC GRID",

    `Codes:

A=14
B=25
C=36
D=47

Find the code whose first digit
is PRIME and second digit is EVEN.

Multiply its first digit by 3.`,

    "36 works: 3 is prime and 6 is even.",

    "9"
  ],


  [
    "NETWORK TRACE",

    `PC-A 192.168.1.20
PC-B 10.0.0.14
PC-C 8.8.8.8
PC-D 172.20.5.9

Choose the PRIVATE address
with an EVEN last octet,
but NOT 192.168.x.x.

Add 6.`,

    "10.0.0.14 → 14+6.",

    "20"
  ],


  [
    "DEBUG THE AI",

    `values=[2,4,1]
x=0
for v: x=x*10+v
x=x+5
print(x*2)

What is printed?`,

    "241 → +5 = 246 → ×2.",

    "492"
  ],


  [
    "DATABASE BREACH",

    `Scores:

Arun 72
Kabir 88
Neha 79

Keep scores >=75,
sort highest first,
then take the first person's
initial's alphabet position.`,

    "Kabir is first. K is 11.",

    "11"
  ],


  [
    "MASTER TERMINAL",

    `L1=28
L2=23
L3=9
L4=20
L5=492
L6=11

A=L1+L2
B=L3+L4
C=last digit of L5
D=L6

Join A,B,C,D with no symbols.`,

    "A=51, B=29, C=2, D=11 → 5129211",

    "5129211"
  ]

];


/* ============================================================
   GAME STATE
============================================================ */

let S = {

  team: "",

  m1: "",

  m2: "",

  n: 0,

  h: 0,

  start: 0,

  lock: false,

  finished: false

};


/* ============================================================
   START GAME
============================================================ */

function startGame() {


  S.team =
    document.getElementById("team")
      .value
      .trim();


  S.m1 =
    document.getElementById("m1")
      .value
      .trim();


  S.m2 =
    document.getElementById("m2")
      .value
      .trim();


  if (
    !S.team ||
    !S.m1 ||
    !S.m2
  ) {

    alert(
      "Enter team name and both participant names."
    );

    return;

  }


  S.start =
    Date.now();


  S.n = 0;

  S.h = 0;

  S.lock = false;

  S.finished = false;


  document
    .getElementById("start")
    .classList
    .add("hidden");


  document
    .getElementById("game")
    .classList
    .remove("hidden");


  document
    .getElementById("tv")
    .textContent =
      S.team;


  document
    .getElementById("timer")
    .textContent =
      "00:00";


  render();


  // Save initial STARTED result

  send("STARTED");

}


/* ============================================================
   RENDER LEVEL
============================================================ */

function render() {


  const x =
    L[S.n];


  document
    .getElementById("lv")
    .textContent =
      (S.n + 1) +
      "/7";


  document
    .getElementById("bar")
    .style.width =
      ((S.n / 7) * 100) +
      "%";


  document
    .getElementById("puzzle")
    .innerHTML = `

      <div class="level">

        LEVEL ${S.n + 1}
        //
        ${esc(x[0])}

      </div>


      <h2>
        ${esc(x[0])}
      </h2>


      <div class="question">

        ${esc(x[1])}

      </div>


      <div class="clue">

        MISSION:
        Solve and submit.

      </div>


      <input
        id="ans"
        inputmode="numeric"
        autocomplete="off"
        placeholder="ENTER ANSWER"
      >


      <button
        onclick="check()"
      >
        SUBMIT
      </button>


      <button
        class="alt"
        onclick="hint()"
      >
        HINT (-1)
      </button>


      <div id="feedback">
      </div>

  `;


  const answer =
    document.getElementById("ans");


  answer.focus();


  answer.onkeydown =
    function(e) {

      if (
        e.key ===
        "Enter"
      ) {

        check();

      }

    };

}


/* ============================================================
   CHECK ANSWER
============================================================ */

function check() {


  if (
    S.lock ||
    S.finished
  ) {

    return;

  }


  const answer =
    document
      .getElementById("ans")
      .value
      .trim();


  const feedback =
    document
      .getElementById("feedback");


  if (
    answer ===
    L[S.n][3]
  ) {


    feedback.className =
      "good";


    feedback.textContent =
      "✓ ACCESS GRANTED";


    S.lock =
      true;


    setTimeout(

      function() {


        S.lock =
          false;


        /*
         * LEVEL 7 COMPLETE
         */

        if (
          S.n === 6
        ) {

          finish();

          return;

        }


        /*
         * NEXT LEVEL
         */

        S.n++;


        /*
         * Save progress
         */

        send("STARTED");


        /*
         * Render next level
         */

        render();


      },

      500

    );


  } else {


    feedback.className =
      "bad";


    feedback.textContent =
      "✕ ACCESS DENIED — TRY AGAIN";


    document
      .getElementById("ans")
      .select();

  }

}


/* ============================================================
   HINT
============================================================ */

function hint() {


  if (
    S.finished
  ) {

    return;

  }


  S.h++;


  const feedback =
    document
      .getElementById("feedback");


  feedback.className =
    "hint";


  feedback.textContent =
    "HINT: " +
    L[S.n][2];


  /*
   * Save current progress
   */

  send("STARTED");

}


/* ============================================================
   FINISH GAME
============================================================ */

function finish() {


  if (
    S.finished
  ) {

    return;

  }


  S.finished =
    true;


  /*
   * Calculate final time
   */

  const elapsed =
    Math.floor(
      (
        Date.now() -
        S.start
      ) / 1000
    );


  /*
   * Update progress
   */

  document
    .getElementById("bar")
    .style.width =
      "100%";


  /*
   * Stop timer on exact final time
   */

  document
    .getElementById("timer")
    .textContent =
      fmt(elapsed);


  /*
   * Make sure level says 7/7
   */

  document
    .getElementById("lv")
    .textContent =
      "7/7";


  /*
   * SHOW FINAL SCREEN
   */

  document
    .getElementById("puzzle")
    .innerHTML = `

      <div class="finish">


        <div class="big">

          ✓

        </div>


        <h2>

          MISSION COMPLETE

        </h2>


        <p>

          Team

          <b>
            ${esc(S.team)}
          </b>

          cleared all 7 levels.

        </p>


        <div class="final-time">

          ${fmt(elapsed)}

        </div>


        <p>

          Hints used:

          <b>
            ${S.h}
          </b>

        </p>


        <div class="save-status">

          RESULT SAVED FOR ADMIN

        </div>


      </div>

  `;


  /*
   * IMPORTANT:
   *
   * Send the FINAL result after the
   * completion screen is created.
   */

  send("FINISHED");

}


/* ============================================================
   SEND RESULT TO GOOGLE APPS SCRIPT
============================================================ */

/*
 * We use a normal HTML form POST
 * to a hidden iframe.
 *
 * This is more reliable for Google Apps Script
 * than fetch() + CORS.
 */

function send(status) {


  if (
    !API
  ) {

    return;

  }


  /*
   * Current elapsed time
   */

  const elapsed =
    Math.floor(
      (
        Date.now() -
        S.start
      ) / 1000
    );


  /*
   * Create form
   */

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    API;


  form.target =
    "aisa_submit_frame";


  form.style.display =
    "none";


  /*
   * Data sent to Apps Script
   */

  const data = {

    team:
      S.team,

    member1:
      S.m1,

    member2:
      S.m2,

    status:
      status,

    level:
      String(
        S.n + 1
      ),

    hints:
      String(
        S.h
      ),

    elapsedSeconds:
      String(
        elapsed
      )

  };


  /*
   * Add hidden fields
   */

  Object
    .keys(data)
    .forEach(

      function(key) {


        const input =
          document.createElement(
            "input"
          );


        input.type =
          "hidden";


        input.name =
          key;


        input.value =
          data[key];


        form.appendChild(
          input
        );

      }

    );


  /*
   * Add form to page
   */

  document.body.appendChild(
    form
  );


  /*
   * Submit to Apps Script
   */

  form.submit();


  /*
   * Remove form later
   */

  setTimeout(

    function() {

      if (
        form.parentNode
      ) {

        form.parentNode
          .removeChild(
            form
          );

      }

    },

    3000

  );

}


/* ============================================================
   FORMAT TIME
============================================================ */

function fmt(seconds) {


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    seconds % 60;


  return (

    String(minutes)
      .padStart(
        2,
        "0"
      )

    +

    ":" +

    String(remaining)
      .padStart(
        2,
        "0"
      )

  );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function esc(value) {


  return String(value)

    .replace(
      /[&<>"']/g,

      function(c) {

        return {

          "&":
            "&amp;",

          "<":
            "&lt;",

          ">":
            "&gt;",

          '"':
            "&quot;",

          "'":
            "&#39;"

        }[c];

      }

    );

}


/* ============================================================
   TIMER
============================================================ */

setInterval(

  function() {


    if (
      S.start &&
      !S.finished
    ) {


      const elapsed =
        Math.floor(
          (
            Date.now() -
            S.start
          ) / 1000
        );


      document
        .getElementById("timer")
        .textContent =
          fmt(elapsed);

    }

  },

  1000

);


/* ============================================================
   PREVENT GAME FROM OPENING NEW WINDOWS
============================================================ */

window.open =
  function() {

    return null;

  };


document.addEventListener(

  "click",

  function(e) {


    const a =
      e.target.closest &&
      e.target.closest("a");


    if (
      a
    ) {

      a.target =
        "_self";

    }

  },

  true

);

</script>

</body>

</html>

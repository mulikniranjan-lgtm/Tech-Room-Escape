<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AISA Tech Escape Room</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02090b;color:#d8f8f2;font:15px Consolas,monospace}
#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#0a3035,#02090b 65%);z-index:5;padding:20px}
.card,.panel,.top{background:#061519;border:1px solid #154047;border-radius:14px}.card{width:min(620px,100%);padding:28px}
h1,h2{color:#00ff9d}h1{margin:0 0 8px}label{display:block;color:#8eb5ae;margin:12px 0 6px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #28585e;background:#02090b;color:#fff}
button{padding:13px 18px;border-radius:9px;border:1px solid #00ff9d;background:#00ff9d;color:#02100c;font-weight:bold;cursor:pointer;margin:8px 6px 0 0}
.alt{background:transparent;color:#00ff9d}.hidden{display:none!important}
#game{max-width:1200px;margin:auto;padding:15px}.top{padding:13px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:5px;z-index:4}
.green{color:#00ff9d}.badge{border:1px solid #28585e;padding:7px 10px;border-radius:8px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.panel{padding:17px}.room{width:100%;height:350px;object-fit:cover;border-radius:10px;border:1px solid #28585e}.level{color:#00ff9d;letter-spacing:2px}
.question{white-space:pre-line;font-size:19px;line-height:1.5;color:#fff}.clue{margin:15px 0;padding:12px;background:#071b1f;border-left:3px solid #00ff9d;color:#b8d7d1;white-space:pre-line}
#feedback{min-height:28px;margin-top:10px;font-weight:bold}.good{color:#00ff9d}.bad{color:#ff6666}.hint{color:#ffd166}.progress{height:7px;background:#082126;margin-top:10px;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#00ff9d;width:0}
.finish{text-align:center}.big{font-size:55px;color:#00ff9d}@media(max-width:800px){.layout{grid-template-columns:1fr}.room{height:260px}}
</style>
</head>
<body>
<div id="start"><div class="card">
<h1>🔐 AISA TECH ESCAPE</h1><p>7-level cyber mission • Team of 2</p>
<label>Team Name</label><input id="team" maxlength="30" placeholder="TEAM ALPHA">
<label>Member 1</label><input id="m1" maxlength="40" placeholder="Participant name">
<label>Member 2</label><input id="m2" maxlength="40" placeholder="Participant name">
<button onclick="startGame()">INITIALIZE MISSION</button>
</div></div>

<div id="game" class="hidden">
<div class="top"><b class="green">🔐 AISA // ESCAPE NODE</b>
<div><span class="badge">TEAM: <b id="tv"></b></span> <span class="badge">TIME: <b id="timer">00:00</b></span> <span class="badge">LEVEL: <b id="lv">1/7</b></span></div></div>
<div class="progress"><i id="bar"></i></div>
<div class="layout"><div class="panel"><img src="room.svg" class="room" alt="Cyber escape room"><p>Search the clues and solve each level. Stay on this page.</p></div><div class="panel" id="puzzle"></div></div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxyrkIEMWMQOqbti6h3AoLKYX-5hD8ql-WsuWoLoTilPzqsD-MiVfkFmamtsOzQfpia/exec".replace(" ","");
const L=[
["CYBER LOCK","A binary lock displays:\n01000110 01001001 01010110 01000101\nConvert it to a word. Count its letters × 7.","01000110=F, 01001001=I, 01010110=V, 01000101=E.","28"],
["ENCRYPTED MESSAGE","KHOOR is encrypted with a Caesar shift. Shift each letter backward by 3. Then calculate H + O using A=1...Z=26.","KHOOR → HELLO. H=8, O=15.","23"],
["LOGIC GRID","Codes: A=14, B=25, C=36, D=47. Find the code whose first digit is PRIME and second digit is EVEN. Multiply its first digit by 3.","36 works: 3 is prime and 6 is even.","9"],
["NETWORK TRACE","PC-A 192.168.1.20\nPC-B 10.0.0.14\nPC-C 8.8.8.8\nPC-D 172.20.5.9\nChoose the PRIVATE address with an EVEN last octet, but NOT 192.168.x.x. Add 6.","10.0.0.14 → 14+6.","20"],
["DEBUG THE AI","values=[2,4,1]\nx=0\nfor v: x=x*10+v\nx=x+5\nprint(x*2)\nWhat is printed?","241 → +5 = 246 → ×2.","492"],
["DATABASE BREACH","Scores: Arun 72, Kabir 88, Neha 79. Keep scores >=75, sort highest first, then take the first person's initial's alphabet position.","Kabir is first. K is 11.","11"],
["MASTER TERMINAL","L1=28, L2=23, L3=9, L4=20, L5=492, L6=11\nA=L1+L2; B=L3+L4; C=last digit of L5; D=L6. Join A,B,C,D with no symbols.","A=51, B=29, C=2, D=11 → 5129211","5129211"]
];
let S={team:"",m1:"",m2:"",n:0,h:0,start:0,lock:false};
function startGame(){S.team=team.value.trim();S.m1=m1.value.trim();S.m2=m2.value.trim();if(!S.team||!S.m1||!S.m2){alert("Enter team and both participant names.");return}S.start=Date.now();document.getElementById("start").classList.add("hidden");game.classList.remove("hidden");tv.textContent=S.team;render();send("STARTED")}
function render(){let x=L[S.n];lv.textContent=(S.n+1)+"/7";bar.style.width=(S.n/7*100)+"%";puzzle.innerHTML='<div class="level">LEVEL '+(S.n+1)+' // '+esc(x[0])+'</div><h2>'+esc(x[0])+'</h2><div class="question">'+esc(x[1])+'</div><div class="clue">MISSION: Solve and submit.</div><input id="ans" inputmode="numeric" placeholder="ENTER ANSWER"><button onclick="check()">SUBMIT</button><button class="alt" onclick="hint()">HINT (-1)</button><div id="feedback"></div>';ans.focus();ans.onkeydown=e=>{if(e.key==="Enter")check()}}
function check(){if(S.lock)return;let f=feedback;if(ans.value.trim()===L[S.n][3]){f.className="good";f.textContent="✓ ACCESS GRANTED";S.lock=true;setTimeout(()=>{S.lock=false;if(S.n===6){finish()}else{S.n++;send("STARTED");render()}},500)}else{f.className="bad";f.textContent="✕ ACCESS DENIED — TRY AGAIN";ans.select()}}
function hint(){S.h++;feedback.className="hint";feedback.textContent="HINT: "+L[S.n][2];send("STARTED")}
function finish(){bar.style.width="100%";let t=Math.floor((Date.now()-S.start)/1000);puzzle.innerHTML='<div class="finish"><div class="big">✓</div><h2>MISSION COMPLETE</h2><p>Team <b>'+esc(S.team)+'</b> cleared all 7 levels.</p><h2>'+fmt(t)+'</h2><p>Hints used: '+S.h+'</p><p class="good">RESULT SAVED FOR ADMIN</p></div>';send("FINISHED")}
function send(status){if(!API)return;fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({team:S.team,member1:S.m1,member2:S.m2,status:status,level:String(S.n+1),hints:String(S.h),elapsedSeconds:Math.floor((Date.now()-S.start)/1000)})}).catch(()=>{})}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
setInterval(()=>{if(S.start)timer.textContent=fmt(Math.floor((Date.now()-S.start)/1000))},1000);
window.open=function(){return null};document.addEventListener("click",e=>{let a=e.target.closest&&e.target.closest("a");if(a)a.target="_self"});
</script>
</body></html>
